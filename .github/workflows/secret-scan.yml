# 平台级脱敏门禁（双保险第二层）
# 第一层：本地脚本 desensitize_gate.sh（AI 自觉，push 前跑）
# 第二层：本 CI（GitHub 服务端强制，任何 AI / 人 push 都自动扫描，忘了也拦得住）
# 规则见仓库根 .gitleaks.toml（覆盖密钥 / 网盘提取码 / 真实客户名 / IMA note_id / 内部任务号）
name: 脱敏门禁 · Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks 扫描（平台级脱敏门禁）
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
